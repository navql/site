# Tell Bing (and the other IndexNow engines) about the site's pages after each GitHub Pages build.
name: IndexNow

on:
  page_build:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.build.status == 'built'
    steps:
      - uses: actions/checkout@v4
      - name: Submit the sitemap URLs
        run: |
          sleep 60  # let the CDN pick up the new build
          urls=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' | jq -R . | jq -sc .)
          body=$(jq -nc --argjson urls "$urls" '{host: "navql.com", key: "338425d8d9debcafb4e9f337f78c1959", keyLocation: "https://navql.com/338425d8d9debcafb4e9f337f78c1959.txt", urlList: $urls}')
          echo "$body"
          code=$(curl -s -o /dev/stderr -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "HTTP $code"
          case "$code" in 200|202) ;; *) exit 1 ;; esac
